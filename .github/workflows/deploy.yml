name: Deploy to VPS

on:
  push:
    branches:
      - master
jobs: 
  deploy: 
    runs-on: ubuntu-latest

    steps: 
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: 147.182.253.238
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            cd ~
            ./deploy.sh